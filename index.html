<!DOCTYPE html>
<html lang="cs" class="h-full w-full m-0 p-0 overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Interaktivní mapa</title>

  <link rel="stylesheet" href="lib/leaflet.css">
  <script src="lib/tailwind.js"></script>
  <script src="lib/leaflet.js"></script>
  <script src="lib/lucide.min.js"></script>
  <script src="lib/xlsx.full.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #020617;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: #020617;
    }

    .custom-dot-marker { background: none; border: none; }
    .dot-element {
      width: 18px; height: 18px;
      background-color: #2563eb;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: transform 0.15s ease-in-out, background-color 0.15s ease;
    }
    .dot-element:hover {
      transform: scale(1.3);
      background-color: #3b82f6;
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 8px; }
  </style>
</head>
<body class="relative w-full h-full select-none">

  <!-- PRELOADER -->
  <div id="loaderScreen" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center p-6 text-white transition-opacity duration-500">
    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <h2 class="text-xl font-bold mb-2">Přednačítání podkladové mapy...</h2>
    <p id="loaderStatus" class="text-slate-400 text-sm mb-4">Příprava mřížky dlaždic...</p>
    <div class="w-72 bg-slate-800 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
      <div id="loaderBar" class="bg-blue-500 h-full rounded-full w-0 transition-all duration-100"></div>
    </div>
  </div>

  <div id="map"></div>

  <!-- MODAL OKÉNKO -->
  <div id="modalOverlay" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-950/30 backdrop-blur-[2px] transition-all duration-300 opacity-0">
    <div class="absolute inset-0" onclick="closeModal()"></div>

    <div id="modalCard" class="relative z-10 w-full max-w-xl bg-slate-900/95 border border-slate-700/80 rounded-3xl shadow-2xl text-white overflow-hidden transform scale-95 transition-all duration-300 flex flex-col max-h-[85vh]">
      
      <div class="flex items-start justify-between p-5 border-b border-slate-800/80 bg-slate-900/50">
        <div>
          <h2 id="modalTitle" class="text-xl sm:text-2xl font-bold text-white tracking-tight mb-1">Název lokality</h2>
          <span id="modalCategory" class="inline-block px-2.5 py-0.5 text-xs font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-full">Kategorie</span>
        </div>
        <button onclick="closeModal()" class="p-2 bg-slate-800/60 hover:bg-slate-700 text-slate-300 hover:text-white rounded-full transition border border-slate-700/50 flex-shrink-0 ml-4">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <div class="p-5 overflow-y-auto custom-scroll flex-1 space-y-4">
        <div id="modalText" class="text-slate-300 text-sm sm:text-base leading-relaxed"></div>
        <div id="modalImageContainer" class="rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 hidden">
          <img id="modalImage" src="" alt="" class="w-full h-56 sm:h-64 object-cover">
        </div>
      </div>

      <div id="modalFooter" class="flex items-center justify-between p-4 border-t border-slate-800/80 bg-slate-900/80">
        <button id="prevPageBtn" onclick="changePage(-1)" class="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm font-medium transition disabled:opacity-30 disabled:cursor-not-allowed">
          <i data-lucide="chevron-left" class="w-4 h-4"></i> Předchozí
        </button>
        <span id="pageIndicator" class="text-xs font-medium text-slate-400 tracking-wider uppercase">Strana 1 z 1</span>
        <button id="nextPageBtn" onclick="changePage(1)" class="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm font-medium transition disabled:opacity-30 disabled:cursor-not-allowed">
          Další <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
      </div>

    </div>
  </div>

  <script>
    const CONFIG = {
      excelUrl: 'body.xlsx',
      minZoom: 8,
      maxZoom: 15,
      tileSize: 256
    };

    let map;
    let pointsData = [];
    let markersMap = new Map();

    let currentPoint = null;
    let currentPageIndex = 0;
    let previousZoom = null;
    let previousCenter = null;

    const MAP_BOUNDS = L.latLngBounds(
      L.latLng(48.8872, 15.8019),
      L.latLng(50.1340, 18.0990)
    );

    function lng2tile(lng, zoom) { return Math.floor((lng + 180) / 360 * Math.pow(2, zoom)); }
    function lat2tile(lat, zoom) {
      return Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom));
    }

    function generateTileUrls() {
      const urls = [];

      for (let z = CONFIG.minZoom; z <= CONFIG.maxZoom; z++) {
        const minX = lng2tile(MAP_BOUNDS.getWest(), z);
        const maxX = lng2tile(MAP_BOUNDS.getEast(), z);
        const minY = lat2tile(MAP_BOUNDS.getNorth(), z);
        const maxY = lat2tile(MAP_BOUNDS.getSouth(), z);

        const xStart = Math.min(minX, maxX);
        const xEnd = Math.max(minX, maxX);
        const yStart = Math.min(minY, maxY);
        const yEnd = Math.max(minY, maxY);

        for (let x = xStart; x <= xEnd; x++) {
          for (let y = yStart; y <= yEnd; y++) {
            urls.push(`./tiles/${z}/${x}/${y}.jpg`);
          }
        }
      }
      return urls;
    }

    async function preloadAllTiles() {
      const urls = generateTileUrls();
      const total = urls.length;
      let loaded = 0;

      const statusEl = document.getElementById('loaderStatus');
      const barEl = document.getElementById('loaderBar');

      if (total === 0) return;

      const loadTile = (url) => {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = img.onerror = () => {
            loaded++;
            const percent = Math.round((loaded / total) * 100);
            statusEl.innerText = `Uloženo ${loaded} z ${total} dlaždic (${percent}%)`;
            barEl.style.width = `${percent}%`;
            resolve();
          };
          img.src = url;
        });
      };

      const batchSize = 30;
      for (let i = 0; i < urls.length; i += batchSize) {
        const batch = urls.slice(i, i + batchSize).map(url => loadTile(url));
        await Promise.all(batch);
      }
    }

    async function initMap() {
      try {
        await preloadAllTiles();

        const loader = document.getElementById('loaderScreen');
        loader.classList.add('opacity-0');
        setTimeout(() => loader.style.display = 'none', 500);

        map = L.map('map', {
          zoomControl: false,
          attributionControl: false,
          minZoom: CONFIG.minZoom,
          maxZoom: CONFIG.maxZoom
        });

        L.tileLayer('./tiles/{z}/{x}/{y}.jpg', {
          minZoom: CONFIG.minZoom,
          maxZoom: CONFIG.maxZoom,
          tileSize: CONFIG.tileSize,
          zoomOffset: 0,
          bounds: MAP_BOUNDS,
          noWrap: true,
          keepBuffer: 500
        }).addTo(map);

        map.fitBounds(MAP_BOUNDS);

        window.addEventListener('resize', () => {
          map.invalidateSize();
        });

        await loadPointsFromExcel();
        lucide.createIcons();

      } catch (err) {
        console.error('Chyba při inicializaci aplikace:', err);
      }
    }

    async function loadPointsFromExcel() {
      try {
        const response = await fetch(CONFIG.excelUrl);
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawData = XLSX.utils.sheet_to_json(worksheet);

        pointsData = rawData.map((row, index) => {
          const pages = [];
          for (let i = 1; i <= 5; i++) {
            if (row[`text${i}`] || row[`image${i}`]) {
              pages.push({ text: row[`text${i}`] || '', image: row[`image${i}`] || '' });
            }
          }
          return {
            id: index + 1,
            title: row.title || 'Bez názvu',
            category: row.category || '',
            lat: parseFloat(row.lat),
            lng: parseFloat(row.lng),
            pages: pages
          };
        });

        renderPoints(pointsData);
      } catch (error) {
        console.error('Chyba při načítání souboru body.xlsx:', error);
      }
    }

    function renderPoints(points) {
      markersMap.forEach(marker => map.removeLayer(marker));
      markersMap.clear();

      points.forEach(pt => {
        if (isNaN(pt.lat) || isNaN(pt.lng)) return;

        const customIcon = L.divIcon({
          className: 'custom-dot-marker',
          html: `<div class="dot-element" title="${pt.title}"></div>`,
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });

        const marker = L.marker([pt.lat, pt.lng], { icon: customIcon }).addTo(map);
        marker.on('click', () => onPointClick(pt, [pt.lat, pt.lng]));
        markersMap.set(pt.id, marker);
      });
    }

    function onPointClick(point, coords) {
      previousZoom = map.getZoom();
      previousCenter = map.getCenter();

      const currentZoom = map.getZoom();
      const targetZoom = Math.max(currentZoom, 12);

      map.flyTo(coords, Math.min(targetZoom, CONFIG.maxZoom), { animate: true, duration: 0.6 });
      openModal(point);
    }

    function openModal(point) {
      currentPoint = point;
      currentPageIndex = 0;
      document.getElementById('modalTitle').innerText = point.title;
      document.getElementById('modalCategory').innerText = point.category || 'Detail';
      updateModalPage();

      const overlay = document.getElementById('modalOverlay');
      const card = document.getElementById('modalCard');
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        card.classList.remove('scale-100');
        card.classList.add('scale-95');
      }, 10);
    }

    function formatTextToParagraphs(rawText) {
      if (!rawText) return '';
      return rawText.toString().split('|')
        .map(p => {
          const trimmed = p.trim().replace(/\r?\n/g, '<br>');
          return trimmed ? `<p class="mb-3 text-justify last:mb-0">${trimmed}</p>` : '';
        }).join('');
    }

    function updateModalPage() {
      if (!currentPoint || !currentPoint.pages || currentPoint.pages.length === 0) return;
      const page = currentPoint.pages[currentPageIndex];
      const totalPages = currentPoint.pages.length;

      document.getElementById('modalText').innerHTML = formatTextToParagraphs(page.text);

      const imgContainer = document.getElementById('modalImageContainer');
      const imgEl = document.getElementById('modalImage');
      if (page.image) {
        imgEl.src = page.image;
        imgContainer.classList.remove('hidden');
      } else {
        imgContainer.classList.add('hidden');
      }

      document.getElementById('pageIndicator').innerText = `Strana ${currentPageIndex + 1} z ${totalPages}`;
      document.getElementById('prevPageBtn').disabled = (currentPageIndex === 0);
      document.getElementById('nextPageBtn').disabled = (currentPageIndex === totalPages - 1);

      const footer = document.getElementById('modalFooter');
      if (totalPages <= 1) footer.classList.add('hidden');
      else footer.classList.remove('hidden');
    }

    function changePage(delta) {
      if (!currentPoint) return;
      const newIndex = currentPageIndex + delta;
      if (newIndex >= 0 && newIndex < currentPoint.pages.length) {
        currentPageIndex = newIndex;
        updateModalPage();
      }
    }

    function closeModal() {
      const overlay = document.getElementById('modalOverlay');
      const card = document.getElementById('modalCard');
      overlay.classList.add('opacity-0');
      card.classList.remove('scale-100');
      card.classList.add('scale-95');
      setTimeout(() => overlay.classList.add('hidden'), 300);

      if (previousCenter !== null && previousZoom !== null) {
        map.flyTo(previousCenter, previousZoom, { animate: true, duration: 0.6 });
      }
    }

    window.addEventListener('DOMContentLoaded', initMap);
  </script>
</body>
</html>
