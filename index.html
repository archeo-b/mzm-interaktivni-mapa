<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f8f9fa;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Vynucení ostrého vykreslení dlaždic a prevence zasekávání */
    .leaflet-tile {
      image-rendering: -webkit-optimize-contrast !important;
      image-rendering: crisp-edges !important;
      image-rendering: pixelated !important;
      outline: 1px solid transparent;
      backface-visibility: hidden;
    }

    .leaflet-tile-container {
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Souřadnice hranic z Vašeho EPSG:3857 rozsahu + 5% rezerva pro okrajové dlaždice na vysokém zoomu
    const southWest = L.latLng(48.9830, 16.0263);
    const northEast = L.latLng(49.8055, 17.8194);
    const MAP_BOUNDS = L.latLngBounds(southWest, northEast).pad(0.05);

    // 2. Inicializace mapy s pružnějším dojezdem (maxBoundsViscosity: 0.5)
    const map = L.map('map', {
      maxBounds: MAP_BOUNDS,
      maxBoundsViscosity: 0.5,
      minZoom: 7,
      maxZoom: 15,
      zoomControl: true,
      attributionControl: false,
      fadeAnimation: false,
      zoomAnimation: true
    }).fitBounds(L.latLngBounds(southWest, northEast));

    // 3. Vrstva dlaždic – zcela BEZ striktního ořezu (bounds), aby okrajové dlaždice nemizely
    L.tileLayer('./tiles/{z}/{x}/{y}.jpg', {
      minZoom: 7,
      maxZoom: 15,
      tileSize: 256,
      noWrap: true,
      keepBuffer: 8,
      updateWhenIdle: false,
      updateWhenZooming: false
    }).addTo(map);
  </script>

</body>
</html>
